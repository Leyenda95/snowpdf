[package]
name = "snowpdf"
version = "0.1.0"
description = "SnowPDF - editor y herramientas PDF 100% locales"
authors = ["SnowPDF"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "snowpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
